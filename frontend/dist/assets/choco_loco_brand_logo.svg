<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Rich warm gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C" />
      <stop offset="45%" stop-color="#FCD888" />
      <stop offset="70%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#C28624" />
    </linearGradient>
    
    <!-- Warm chocolate glossy gradient -->
    <linearGradient id="chocoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A2713" />
      <stop offset="50%" stop-color="#3B180A" />
      <stop offset="100%" stop-color="#240D05" />
    </linearGradient>

    <!-- Cocoa pod emblem gradient -->
    <radialGradient id="podGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCD888" />
      <stop offset="60%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#9C6314" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Artisan Monogram Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer ornate gold ring -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="14 4 4 4" opacity="0.9" />
    <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5" />
    <!-- Inner chocolate medallion -->
    <circle cx="50" cy="50" r="38" fill="url(#chocoGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />
    
    <!-- Cocoa bean / chocolate swirl icon -->
    <path d="M50 20 C64 20 74 34 74 50 C74 66 62 78 50 80 C36 78 26 66 26 50 C26 34 36 20 50 20 Z" fill="none" stroke="url(#podGrad)" stroke-width="2" />
    <path d="M50 20 Q56 45 44 65 Q50 75 50 80" fill="none" stroke="url(#podGrad)" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- CL Monogram Letters in Gold -->
    <text x="50" y="56" font-family="'Playfair Display', serif" font-weight="900" font-size="24" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">CL</text>
    <text x="50" y="70" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" fill="#E5A93C" text-anchor="middle" letter-spacing="3">100%</text>
  </g>

  <!-- Right: Script Wordmark "Choco Loco" + "PATISSERIE · CAFÉ · LOUNGE" -->
  <g transform="translate(125, 20)">
    <!-- Main Script Wordmark with chocolate drips -->
    <text x="0" y="52" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-style="italic" font-size="46" fill="url(#goldGrad)" letter-spacing="0.5">
      Choco Loco
    </text>
    
    <!-- Delicate Chocolate Drips underneath the text -->
    <path d="M48 56 Q50 67 48 70 Q46 67 48 56 Z" fill="url(#goldGrad)" />
    <circle cx="48" cy="73" r="2.5" fill="url(#goldGrad)" />

    <path d="M125 56 Q127 65 125 68 Q123 65 125 56 Z" fill="url(#goldGrad)" />
    <circle cx="125" cy="71" r="2" fill="url(#goldGrad)" />

    <path d="M210 56 Q212 69 210 74 Q208 69 210 56 Z" fill="url(#goldGrad)" />
    <circle cx="210" cy="77" r="3" fill="url(#goldGrad)" />

    <!-- Subtitle: Patisserie | Café | Lounge -->
    <text x="3" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#FFF4E6" letter-spacing="5" opacity="0.9">
      PATISSERIE <tspan fill="#E5A93C">·</tspan> CAFÉ <tspan fill="#E5A93C">·</tspan> LOUNGE
    </text>
    
    <!-- Micro Tag: Pipeline, The Gambia -->
    <text x="3" y="93" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="8" fill="#E5A93C" letter-spacing="3" opacity="0.8">
      PIPELINE · KAIRABA AVENUE · THE GAMBIA
    </text>
  </g>
</svg>
