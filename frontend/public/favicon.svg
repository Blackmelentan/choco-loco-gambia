<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1B0E"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1D0"/>
      <stop offset="50%" stop-color="#F5B041"/>
      <stop offset="100%" stop-color="#D48A18"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  <!-- Elegant Drip Script CL Monogram -->
  <text x="32" y="42" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-style="italic" font-size="34" fill="url(#goldGrad)" text-anchor="middle">CL</text>
  <!-- Chocolate drip drops -->
  <circle cx="24" cy="52" r="2" fill="url(#goldGrad)"/>
  <circle cx="40" cy="54" r="2.5" fill="url(#goldGrad)"/>
</svg>
